<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaKaStyle - Agregar Nueva Gorra</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --accent-color: #2e59d9;
            --text-color: #5a5c69;
            --light-gray: #e3e6f0;
            --success-color: #1cc88a;
            --danger-color: #e74a3b;
        }
        
        body {
            background-color: #f8f9fc;
            color: var(--text-color);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .content {
            padding: 20px;
            background-color: white;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            margin: 20px auto;
            max-width: 1200px;
        }
        
        .form-header {
            border-bottom: 1px solid var(--light-gray);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            border: 1px solid var(--light-gray);
            border-radius: 0.35rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        
        .input-group-text {
            background-color: var(--secondary-color);
            border: 1px solid var(--light-gray);
            color: var(--text-color);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .btn-secondary {
            background-color: #858796;
            border-color: #858796;
        }
        
        .btn-secondary:hover {
            background-color: #717384;
            border-color: #6b6d7d;
        }
        
        .img-preview-container {
            margin-top: 1rem;
            border: 1px dashed var(--light-gray);
            border-radius: 0.35rem;
            padding: 1rem;
            text-align: center;
            background-color: var(--secondary-color);
        }
        
        .img-preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 0.35rem;
            display: none;
            margin: 0 auto;
        }
        
        .file-upload-label {
            display: block;
            padding: 1.5rem;
            border: 2px dashed var(--light-gray);
            border-radius: 0.35rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: var(--secondary-color);
        }
        
        .file-upload-label:hover {
            border-color: var(--primary-color);
            background-color: rgba(78, 115, 223, 0.05);
        }
        
        .file-upload-icon {
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }
        
        .is-invalid {
            border-color: var(--danger-color);
        }
        
        .invalid-feedback {
            display: block;
            color: var(--danger-color);
            font-size: 0.85rem;
        }
        
        .alert {
            border-radius: 0.35rem;
        }
        
        .card-style {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
    <!-- ... tu navbar ... -->
     <li sec:authorize="isAuthenticated()">
        <form th:action="@{/logout}" method="post" class="dropdown-item p-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-link text-decoration-none px-3 py-1">
                <i class="fas fa-sign-out-alt"></i> Cerrar sesión
            </button>
        </form>
    </li>
    <!-- ... resto navbar ... -->
</nav>

<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
    <div class="content card-style">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center form-header">
            <h1 class="h2 mb-0"><i class="fas fa-plus-circle me-2"></i>Agregar Nueva Gorra</h1>
            <a th:href="@{/admin/productos}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <!-- Mostrar mensajes de éxito o error -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/admin/productos/agregar}" th:object="${producto}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre del Producto</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required placeholder="Ej: Gorra W">
                </div>
                <div class="col-md-6 mb-3">
                    <label for="categoria" class="form-label">Categoría</label>
                    <select class="form-select" id="categoria" th:field="*{categoria.id}" required>
                        <option value="">Seleccionar categoría</option>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.id}"
                                th:text="${cat.nombre}">
                        </option>
                    </select>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <label for="precio" class="form-label">Precio</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-dollar-sign"></i></span>
                        <input type="number" class="form-control" id="precio" th:field="*{precio}" step="0.01" min="0" required placeholder="20.50">
                        <span class="input-group-text">.00</span>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="stock" class="form-label">Stock Disponible</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-boxes"></i></span>
                        <input type="number" class="form-control" id="stock" th:field="*{stock}" min="0" required placeholder="20">
                    </div>
                </div>
            </div>

            <div class="mb-4">
                <label for="descripcion" class="form-label">Descripción del Producto</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="4" placeholder="Descripción detallada de la gorra..."></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Imagen del Producto</label>
                <label for="imagenFile" class="file-upload-label">
                    <div class="file-upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="mb-2">Haz clic para subir una imagen</div>
                    <div class="text-muted small">Formatos soportados: JPG, PNG (Max. 5MB)</div>
                    <input type="file" class="d-none" id="imagenFile" name="imagenFile" accept="image/*">
                </label>
                <div class="img-preview-container mt-3">
                    <div class="mb-2 text-muted">Vista previa de la imagen</div>
                    <img id="imagenPreview" class="img-preview" alt="Previsualización de imagen" th:src="${producto.imagen != null ? '/uploads/' + producto.imagen : ''}" th:style="${producto.imagen != null ? 'display:block;' : 'display:none;'}">
                </div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="reset" class="btn btn-outline-secondary me-md-2">
                    <i class="fas fa-undo me-1"></i> Limpiar
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Guardar Producto
                </button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    // Previsualización de imagen
    document.getElementById('imagenFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('imagenPreview');
                preview.src = event.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
             document.getElementById('imagenPreview').style.display = 'none';
             document.getElementById('imagenPreview').src = '#';
        }
    });
    
    // Cambiar estilo del label cuando se selecciona un archivo
    document.getElementById('imagenFile').addEventListener('change', function() {
        const label = document.querySelector('.file-upload-label');
        if (this.files.length > 0) {
            label.innerHTML = `
                <div class="file-upload-icon text-success">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="mb-2">Archivo seleccionado</div>
                <div class="text-muted small">${this.files[0].name}</div>
            `;
            label.style.borderColor = 'var(--success-color)';
        } else {
            label.innerHTML = `
                <div class="file-upload-icon">
                    <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="mb-2">Haz clic para subir una imagen</div>
                <div class="text-muted small">Formatos soportados: JPG, PNG (Max. 5MB)</div>
            `;
            label.style.borderColor = 'var(--light-gray)';
        }
    });
</script>
</body>
</html>
