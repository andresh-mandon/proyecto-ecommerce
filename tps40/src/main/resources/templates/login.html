<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        /* Tus estilos CSS existentes */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #000;
            background-image: url('img/Gorraloguin.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            background-color: #1d4e4f;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            display: flex;
            width: 100%;
            max-width: 700px;
            color: white;
            overflow: hidden;
        }

        .login-form-container {
            padding: 40px;
            width: 50%;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centrar el título JaKaStyle */
        }

        .jaka-style-title {
            color: #0e0d0d;
            font-size: 1.5em;
            margin-bottom: 20px;
        }

        .social-login-container {
            background-color: #2e3a3f;
            padding: 40px;
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .social-login-container h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #3b5998;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 20px;
            margin-bottom: 10px;
            width: 100%;
            text-decoration: none;
        }

        .social-button.google {
            background-color: #db4437;
        }

        .social-button.hotmail {
            background-color: #00acee;
        }

        .social-button img {
            width: 24px;
            height: 24px;
            margin-right: 10px;
        }

        .login-form-container h2 {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            position: relative;
            margin-bottom: 15px; /* Reduje un poco el margen */
            width: 100%; /* Asegura que los campos ocupen todo el ancho */
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #2e3a3f;
            color: white;
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-8%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .toggle-password img {
            width: 20px;
            height: 20px;
            filter: invert(1);
        }

        .forgot {
            text-align: right;
            margin-bottom: 20px;
        }

        .forgot a {
            text-decoration: none;
            font-size: 14px;
            color: rgb(11, 34, 35);
            cursor: pointer; /* Añadimos cursor para indicar que es interactivo */
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #0b2223;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: #083133;
        }

        .register {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            cursor: pointer; /* Añadimos cursor para indicar que es interactivo */
        }

        .register a {
            color: rgb(11, 34, 35);
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Estilos para los formularios de recuperación y registro (inicialmente ocultos) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Fondo oscuro semitransparente */
            display: none; /* Oculto por defecto */
            justify-content: center;
            align-items: center;
            z-index: 10; /* Asegura que esté por encima del contenido */
        }

        .modal-form {
            background-color: #1d4e4f;
            color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .modal-form h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .modal-form .form-group {
            margin-bottom: 15px;
        }

        .modal-form .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .modal-form .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            background-color: #2e3a3f;
            color: white;
        }

        .modal-form button[type="submit"] {
            width: 100%;
            background-color: #0b2223;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .modal-form button[type="submit"]:hover {
            background-color: #083133;
        }

        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            color: white;
            border: none;
            font-size: 50px;
            cursor: pointer;
        }

        /* Mensaje de alerta */
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            width: 100%;
            text-align: center;
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        .alert-success {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
    </style>
</head>
</head>
<body>
<div class="login-container">
    <div class="login-form-container">
        <h1 class="jaka-style-title">JaKaStyle</h1>
        <h2>Iniciar Sesión</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

        <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión correctamente.</div>

        <div th:if="${param.registroExitoso}" class="alert alert-success">
            Registro exitoso. Ahora puedes iniciar sesión.
        </div>

        <form th:action="@{/usuarios/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="email">Correo electrónico o Nombre de Usuario</label>
                <input type="text" id="email" name="username" placeholder="Ingresa tu correo o nombre de usuario" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <img id="eyeIcon" src="https://cdn-icons-png.flaticon.com/512/709/709612.png" alt="Ver contraseña">
                </button>
            </div>

            <div class="forgot">
                <a href="#" onclick="showForgotPasswordForm()">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit">Iniciar Sesión</button>

            <div class="register">
                ¿No tienes cuenta? <a href="#" onclick="showRegisterForm()">Regístrate</a>
            </div>
        </form>
    </div>
    <div class="social-login-container">
        <h3>O inicia sesión con</h3>
        <a href="#" class="social-button google">
            <img src="img/Google.png.png" alt="Google"> Google
        </a>
        <a href="#" class="social-button facebook">
            <img src="img/facebook.png.png" alt="Facebook"> Facebook
        </a>
        <a href="#" class="social-button hotmail">
            <img src="img/Hotmail.png.png" alt="Hotmail"> Hotmail
        </a>
    </div>
</div>

<div id="forgotPasswordOverlay" class="overlay">
    <div class="modal-form">
        <button class="close-button" onclick="hideForgotPasswordForm()">&times;</button>
        <h2>Recuperar Contraseña</h2>
        <div class="form-group">
            <label for="forgotEmail">Correo electrónico</label>
            <input type="email" id="forgotEmail" placeholder="Ingresa tu correo electrónico" required>
        </div>
        <button type="submit">Enviar enlace de recuperación</button>
    </div>
</div>

<div id="registerOverlay" class="overlay">
    <div class="modal-form">
        <button class="close-button" onclick="hideRegisterForm()">&times;</button>
        <h2>Crear Cuenta</h2>
        <form th:action="@{/usuarios/registro}" method="post" id="registroForm">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label for="registerNombre">Nombre</label>
                <input type="text" id="registerNombre" name="nombre" placeholder="Ingresa tu nombre" required>
            </div>
            <div class="form-group">
                <label for="registerApellido">Apellido</label>
                <input type="text" id="registerApellido" name="apellido" placeholder="Ingresa tu apellido" required>
            </div>
            <div class="form-group">
                <label for="registerEmail">Correo electrónico</label>
                <input type="email" id="registerEmail" name="email" placeholder="Ingresa tu correo electrónico" required>
            </div>
            <div class="form-group">
                <label for="registerUsuario">Nombre de usuario</label>
                <input type="text" id="registerUsuario" name="nombreUsuario" placeholder="Ingresa tu nombre de usuario" required>
            </div>
            <div class="form-group">
                <label for="registerTelefono">Teléfono de contacto</label>
                <input type="tel" id="registerTelefono" name="contacto" placeholder="Ingresa tu teléfono" required>
            </div>
            <div class="form-group">
                <label for="registerDireccion">Dirección</label>
                <input type="text" id="registerDireccion" name="direccion" placeholder="Ingresa tu dirección" required>
            </div>
            <div class="form-group">
                <label for="registerPassword">Contraseña</label>
                <input type="password" id="registerPassword" name="contraseña" placeholder="Ingresa tu contraseña" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña" required>
                <span id="passwordError" style="color: red; display: none;">Las contraseñas no coinciden</span>
            </div>

            <button type="submit">Registrarse</button>
        </form>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = document.getElementById("eyeIcon");

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.src = "https://cdn-icons-png.flaticon.com/512/709/709611.png"; // ojo tachado
        } else {
            passwordInput.type = "password";
            eyeIcon.src = "https://cdn-icons-png.flaticon.com/512/709/709612.png"; // ojo normal
        }
    }

    function showForgotPasswordForm() {
        document.getElementById('forgotPasswordOverlay').style.display = 'flex';
    }

    function hideForgotPasswordForm() {
        document.getElementById('forgotPasswordOverlay').style.display = 'none';
    }

    function showRegisterForm() {
        document.getElementById('registerOverlay').style.display = 'flex';
    }

    function hideRegisterForm() {
        document.getElementById('registerOverlay').style.display = 'none';
    }

    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = this.value;
        const errorElement = document.getElementById('passwordError');

        if (password !== confirmPassword) {
            errorElement.style.display = 'block';
        } else {
            errorElement.style.display = 'none';
        }
    });

    // Validar antes de enviar el formulario de registro
    document.getElementById('registroForm').addEventListener('submit', function(event) {
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            event.preventDefault(); // Detener el envío
            alert('Las contraseñas no coinciden. Por favor verifica.');
        }
    });
</script>
</body>
</html>
