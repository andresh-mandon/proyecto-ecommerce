<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JaKaStyle - Editar Usuario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --accent-color: #2e59d9;
            --text-color: #5a5c69;
            --light-gray: #e3e6f0;
            --success-color: #1cc88a;
            --danger-color: #e74a3b;
        }
        
        body {
            background-color: #f8f9fc;
            color: var(--text-color);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        
        .content {
            padding: 20px;
            background-color: white;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            margin: 20px auto;
            max-width: 1200px;
        }
        
        .form-header {
            border-bottom: 1px solid var(--light-gray);
            padding-bottom: 1rem;
            margin-bottom: 2rem;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }
        
        .form-control, .form-select {
            border: 1px solid var(--light-gray);
            border-radius: 0.35rem;
            padding: 0.75rem 1rem;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.25);
        }
        
        .input-group-text {
            background-color: var(--secondary-color);
            border: 1px solid var(--light-gray);
            color: var(--text-color);
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-primary:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .btn-secondary {
            background-color: #858796;
            border-color: #858796;
        }
        
        .btn-secondary:hover {
            background-color: #717384;
            border-color: #6b6d7d;
        }
        
        .is-invalid {
            border-color: var(--danger-color);
        }
        
        .invalid-feedback {
            display: block;
            color: var(--danger-color);
            font-size: 0.85rem;
        }
        
        .alert {
            border-radius: 0.35rem;
        }
        
        .card-style {
            border: none;
            border-radius: 0.35rem;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.1);
        }
        
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
        }
        
        .password-input-group {
            position: relative;
        }
        
        .role-badge {
            font-size: 0.9rem;
            padding: 0.35rem 0.75rem;
        }
        
        .role-badge-admin {
            background-color: #4e73df;
        }
        
        .role-badge-user {
            background-color: #858796;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">JaKaStyle</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown">
                        <i class="fas fa-user"></i> <span th:text="${#authentication.name}">Usuario</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="#"><i class="fas fa-user-cog"></i> Perfil</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="dropdown-item p-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-link text-decoration-none px-3 py-1">
                                    <i class="fas fa-sign-out-alt"></i> Cerrar sesión
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="col-md-12 px-md-4">
    <div class="content card-style">
        <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center form-header">
            <h1 class="h2 mb-0"><i class="fas fa-user-edit me-2"></i>Editar Usuario</h1>
            <a th:href="@{/admin/usuarios}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <!-- Mensajes de éxito o error -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{'/admin/usuarios/actualizar/' + ${usuario.id}}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="id" th:value="${usuario.id}">
        
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                        <input type="text" class="form-control" id="nombre" name="nombre" th:value="${usuario.nombre}" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="apellido" class="form-label">Apellido</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-user-tag"></i></span>
                        <input type="text" class="form-control" id="apellido" name="apellido" th:value="${usuario.apellido}" required>
                    </div>
                </div>
            </div>
        
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="nombreUsuario" class="form-label">Nombre de Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-at"></i></span>
                        <input type="text" class="form-control" id="nombreUsuario" name="nombreUsuario"
                               th:value="${usuario.nombreUsuario}" required
                               th:classappend="${error != null and #strings.contains(error, 'nombre de usuario')} ? 'is-invalid'">
                    </div>
                    <div th:if="${error != null and #strings.contains(error, 'nombre de usuario')}" class="invalid-feedback">
                        <span th:text="${error}"></span>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email"
                               th:value="${usuario.email}" required
                               th:classappend="${error != null and #strings.contains(error, 'correo electrónico')} ? 'is-invalid'">
                    </div>
                    <div th:if="${error != null and #strings.contains(error, 'correo electrónico')}" class="invalid-feedback">
                        <span th:text="${error}"></span>
                    </div>
                </div>
            </div>
        
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="contacto" class="form-label">Contacto</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-phone"></i></span>
                        <input type="text" class="form-control" id="contacto" name="contacto" th:value="${usuario.contacto}" required>
                    </div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="direccion" class="form-label">Dirección</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-map-marker-alt"></i></span>
                        <input type="text" class="form-control" id="direccion" name="direccion" th:value="${usuario.direccion}" required>
                    </div>
                </div>
            </div>
        
            <div class="mb-4">
                <label for="contraseña" class="form-label">Contraseña</label>
                <div class="password-input-group">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="contraseña" name="contraseña" placeholder="Dejar en blanco para mantener la actual">
                    </div>
                    <i class="far fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <small class="text-muted">La contraseña debe contener al menos 8 caracteres, incluyendo mayúsculas, minúsculas y números.</small>
            </div>
        
            <div class="mb-4">
                <label for="rol" class="form-label">Rol</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user-shield"></i></span>
                    <select class="form-select" id="rol" name="rolNombre" required>
                        <option value="ROLE_ADMIN" th:selected="${usuario.rol.nombreRol == 'ROLE_ADMIN'}">Administrador</option>
                        <option value="ROLE_USUARIO" th:selected="${usuario.rol.nombreRol == 'ROLE_USUARIO'}">Usuario</option>
                    </select>
                </div>
                <div class="mt-2">
                    <span class="badge role-badge"
                          th:classappend="${usuario.rol.nombreRol == 'ROLE_ADMIN'} ? 'role-badge-admin' : 'role-badge-user'">
                        <span th:text="${usuario.rol.nombreRol == 'ROLE_ADMIN'} ? 'Administrador' : 'Usuario'"></span>
                    </span>
                </div>
            </div>
        
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                <button type="reset" class="btn btn-outline-secondary me-md-2">
                    <i class="fas fa-undo me-1"></i> Restablecer
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Guardar Cambios
                </button>
            </div>
        </form>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>
    // Mostrar/ocultar contraseña
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#contraseña');
    
    togglePassword.addEventListener('click', function (e) {
        // toggle the type attribute
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        // toggle the eye icon
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
    });

    // Validación AJAX para nombre de usuario
    document.getElementById('nombreUsuario').addEventListener('blur', function() {
    const username = this.value;
    const userId = document.querySelector('input[name="id"]').value;
    
    if (username) {
        fetch(`/admin/usuarios/check-username?username=${username}&id=${userId}`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error en la respuesta del servidor');
                }
                return response.json();
            })
            .then(data => {
                if (data.exists) {
                    this.classList.add('is-invalid');
                    let feedback = this.parentNode.nextElementSibling;
                    if (!feedback || !feedback.classList.contains('invalid-feedback')) {
                        feedback = document.createElement('div');
                        feedback.className = 'invalid-feedback';
                        this.parentNode.parentNode.appendChild(feedback);
                    }
                    feedback.textContent = 'Este nombre de usuario ya está en uso';
                } else {
                    this.classList.remove('is-invalid');
                    const feedback = this.parentNode.nextElementSibling;
                    if (feedback && feedback.classList.contains('invalid-feedback')) {
                        feedback.textContent = '';
                    }
                }
            })
            .catch(error => {
                console.error('Error en la validación:', error);
            });
    }
});
</script>
</body>
</html>
