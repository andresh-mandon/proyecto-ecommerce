<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | JaKaStyle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-bg: #f8f9fa;
            --text-color: #333333;
            --white: #ffffff;
            --border-color: #e0e0e0;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .auth-container {
            background-color: var(--white);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .brand-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px;
            text-align: center;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: bold;
            margin: 0;
        }

        .brand-subtitle {
            font-size: 1rem;
            margin: 5px 0 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-tabs {
            border-bottom: 1px solid var(--border-color);
            padding: 0 20px;
        }

        .nav-link {
            color: var(--primary-color);
            font-weight: 500;
            border: none;
            padding: 12px 20px;
            margin-right: 5px;
        }

        .nav-link.active {
            color: var(--secondary-color);
            border-bottom: 2px solid var(--secondary-color);
            background-color: transparent;
        }

        .tab-content {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 0.25rem rgba(52, 152, 219, 0.25);
            outline: none;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 38px;
            cursor: pointer;
            color: var(--secondary-color);
        }

        .btn-auth {
            width: 100%;
            background-color: var(--secondary-color);
            color: var(--white);
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-auth:hover {
            background-color: var(--primary-color);
        }

        .terms-link-container {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .terms-link {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .terms-link:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-size: 14px;
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .alert-success {
            background-color: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .invalid-feedback {
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="brand-header">
        <h1 class="brand-title">JaKaStyle</h1>
        <p class="brand-subtitle">Tu estilo, nuestra pasión</p>
    </div>

    <ul class="nav nav-tabs" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#login" type="button" role="tab" aria-controls="login" aria-selected="true">Iniciar Sesión</button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#register" type="button" role="tab" aria-controls="register" aria-selected="false">Registrarse</button>
        </li>
    </ul>

    <div class="tab-content" id="authTabsContent">
        <!-- Alertas generales -->
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
        <div th:if="${param.logout}" class="alert alert-success">Has cerrado sesión correctamente.</div>
        <div th:if="${param.registroExitoso}" class="alert alert-success">
            Registro exitoso. Ahora puedes iniciar sesión.
        </div>

        <!-- Pestaña de Login -->
        <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="login-tab">
            <form th:action="@{/usuarios/login}" method="post" id="loginForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="form-group">
                    <label for="username" class="form-label">Correo electrónico o Nombre de Usuario</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Ingresa tu correo o nombre de usuario" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
                    <i class="fas fa-eye password-toggle" id="togglePassword"></i>
                </div>

                <button type="submit" class="btn-auth">Iniciar Sesión</button>
            </form>
        </div>

        <!-- Pestaña de Registro -->
        <div class="tab-pane fade" id="register" role="tabpanel" aria-labelledby="register-tab">
            <form th:action="@{/usuarios/registro}" method="post" id="registerForm">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="registerNombre">Nombre</label>
                            <input type="text" id="registerNombre" name="nombre" class="form-control" placeholder="Ingresa tu nombre" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="registerApellido">Apellido</label>
                            <input type="text" id="registerApellido" name="apellido" class="form-control" placeholder="Ingresa tu apellido" required>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="registerEmail">Correo electrónico</label>
                    <input type="email" id="registerEmail" name="email" class="form-control" placeholder="Ingresa tu correo electrónico" required>
                </div>
                
                <div class="form-group">
                    <label for="registerUsuario">Nombre de usuario</label>
                    <input type="text" id="registerUsuario" name="nombreUsuario" class="form-control" placeholder="Ingresa tu nombre de usuario" required>
                </div>
                
                <div class="form-group">
                    <label for="registerTelefono">Teléfono de contacto</label>
                    <input type="tel" id="registerTelefono" name="contacto" class="form-control" placeholder="Ingresa tu teléfono" required>
                </div>
                
                <div class="form-group">
                    <label for="registerDireccion">Dirección</label>
                    <input type="text" id="registerDireccion" name="direccion" class="form-control" placeholder="Ingresa tu dirección" required>
                </div>
                
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="registerPassword">Contraseña</label>
                            <input type="password" id="registerPassword" name="contraseña" class="form-control" placeholder="Ingresa tu contraseña" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="confirmPassword">Confirmar contraseña</label>
                            <input type="password" id="confirmPassword" class="form-control" placeholder="Confirma tu contraseña" required>
                            <div id="passwordError" class="invalid-feedback" style="display: none;">Las contraseñas no coinciden</div>
                        </div>
                    </div>
                </div>

                <div class="form-group form-check">
                    <input type="checkbox" class="form-check-input" id="acceptTerms" required>
                    <label class="form-check-label" for="acceptTerms">Acepto los <a th:href="@{/usuarios/terminos}" class="terms-link">Términos y Condiciones</a></label>
                </div>
                
                <button type="submit" class="btn-auth">Registrarse</button>
            </form>
        </div>
    </div>

    <div class="terms-link-container">
        <a th:href="@{/usuarios/terminos}" class="terms-link">Términos y Condiciones</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Toggle password visibility for login
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    
    togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
    });

    // Toggle password visibility for register password
    const toggleRegisterPassword = document.createElement('i');
    toggleRegisterPassword.className = 'fas fa-eye password-toggle';
    toggleRegisterPassword.style.right = '15px';
    toggleRegisterPassword.style.top = '38px';
    toggleRegisterPassword.style.cursor = 'pointer';
    toggleRegisterPassword.style.color = 'var(--secondary-color)';
    
    const registerPassword = document.querySelector('#registerPassword');
    registerPassword.parentNode.style.position = 'relative';
    registerPassword.parentNode.appendChild(toggleRegisterPassword);
    
    toggleRegisterPassword.addEventListener('click', function() {
        const type = registerPassword.getAttribute('type') === 'password' ? 'text' : 'password';
        registerPassword.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
    });

    // Toggle password visibility for confirm password
    const toggleConfirmPassword = document.createElement('i');
    toggleConfirmPassword.className = 'fas fa-eye password-toggle';
    toggleConfirmPassword.style.right = '15px';
    toggleConfirmPassword.style.top = '38px';
    toggleConfirmPassword.style.cursor = 'pointer';
    toggleConfirmPassword.style.color = 'var(--secondary-color)';
    
    const confirmPassword = document.querySelector('#confirmPassword');
    confirmPassword.parentNode.style.position = 'relative';
    confirmPassword.parentNode.appendChild(toggleConfirmPassword);
    
    toggleConfirmPassword.addEventListener('click', function() {
        const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
        confirmPassword.setAttribute('type', type);
        this.classList.toggle('fa-eye-slash');
    });

    // Validar contraseñas en registro
    confirmPassword.addEventListener('input', function() {
        const password = registerPassword.value;
        const confirm = this.value;
        const errorElement = document.getElementById('passwordError');

        if (password !== confirm && confirm.length > 0) {
            errorElement.style.display = 'block';
            this.classList.add('is-invalid');
        } else {
            errorElement.style.display = 'none';
            this.classList.remove('is-invalid');
        }
    });

    // Validar términos y condiciones antes de registrar
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        if (!document.getElementById('acceptTerms').checked) {
            e.preventDefault();
            alert('Debes aceptar los términos y condiciones para registrarte.');
            return false;
        }
        
        if (registerPassword.value !== confirmPassword.value) {
            e.preventDefault();
            alert('Las contraseñas no coinciden. Por favor verifica.');
            return false;
        }
        
        return true;
    });
</script>
</body>
</html>
